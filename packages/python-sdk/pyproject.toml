[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "troll-music-ai"
version = "0.3.0"
description = "Turn any idea, joke or roast into lyrics, beats, songs and music videos. Python toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",  # built-in beat engine
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional engines. None of these download model weights at install time.
images = ["pillow>=10"]            # built-in title cards and artwork
speech = ["pyttsx3>=2.90"]         # built-in system speech
musicgen = ["torch>=2.2", "transformers>=4.40"]  # then: python scripts/download_models.py musicgen

[tool.setuptools.packages.find]
where = ["src"]
